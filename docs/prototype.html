<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niger Delta Environmental Risk Observatory</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #111; color: #eee; }
  
  #header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    background: linear-gradient(180deg, rgba(17,17,17,0.95) 60%, transparent);
    padding: 12px 20px;
  }
  #header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  #header span { color: #888; font-size: 12px; }
  
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
  
  #legend {
    position: absolute; bottom: 30px; right: 15px; z-index: 10;
    background: rgba(17,17,17,0.85); border-radius: 8px; padding: 12px 14px;
    border: 1px solid #333; min-width: 160px;
  }
  #legend h4 { font-size: 11px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0; }
  
  #stats {
    position: absolute; bottom: 30px; left: 15px; z-index: 10;
    background: rgba(17,17,17,0.85); border-radius: 8px; padding: 12px 16px;
    border: 1px solid #333; display: flex; gap: 24px;
  }
  .stat { text-align: center; }
  .stat-value { font-size: 20px; font-weight: 700; color: #fff; }
  .stat-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.3px; }
  
  .popup-content { color: #111; }
  .popup-content h3 { font-size: 14px; margin-bottom: 4px; }
  .popup-content p { font-size: 12px; margin: 2px 0; }

  #banner {
    position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
    z-index: 20; background: #b3261e; color: #fff; padding: 8px 16px;
    border-radius: 6px; font-size: 13px; max-width: 90%;
  }

  /* Timeline scrubber */
  #timeline {
    position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: rgba(17,17,17,0.9); border: 1px solid #333;
    border-radius: 8px; padding: 10px 16px; width: min(480px, 80vw);
  }
  #timeline-row { display: flex; align-items: center; gap: 10px; }
  #year-slider { flex: 1; accent-color: #ff6b35; }
  #year-label { font-size: 13px; font-weight: 600; color: #fff; min-width: 68px; text-align: center; }
  #timeline-toggle {
    background: #222; color: #ccc; border: 1px solid #444; border-radius: 5px;
    font-size: 11px; padding: 3px 8px; cursor: pointer;
  }
  #timeline-toggle.on { background: #ff6b35; color: #111; border-color: #ff6b35; }
  #timeline-note { font-size: 10px; color: #888; margin-top: 4px; }
  
  @media (max-width: 640px) {
    #stats { flex-wrap: wrap; gap: 12px; padding: 10px 14px; }
    .stat-value { font-size: 16px; }
    #legend { display: none; }
  }
</style>
</head>
<body>

<div id="header">
  <h1>Niger Delta Environmental Risk Observatory</h1>
  <span>Oil spills · Gas flaring · Environmental change · Built from Port Harcourt</span>
</div>

<div id="map"></div>

<div id="legend">
  <h4>Spill size (barrels)</h4>
  <div class="legend-item"><span class="legend-dot" style="width:6px;height:6px;background:#ff6b35;"></span> &lt;10</div>
  <div class="legend-item"><span class="legend-dot" style="width:10px;height:10px;background:#ff6b35;"></span> 10–500</div>
  <div class="legend-item"><span class="legend-dot" style="width:16px;height:16px;background:#ff6b35;"></span> &gt;500</div>
  <div style="margin-top:8px;"><span class="legend-dot" style="background:#ff6b35;"></span> Oil</div>
  <div><span class="legend-dot" style="background:#4ecdc4;"></span> Condensate</div>
</div>

<div id="banner" hidden></div>

<div id="timeline" hidden>
  <div id="timeline-row">
    <input type="range" id="year-slider" min="2006" max="2026" value="2026" step="1">
    <span id="year-label">All years</span>
    <button id="timeline-toggle" title="Switch between cumulative and single-year view">Single year</button>
  </div>
  <div id="timeline-note">Drag to scrub the spill record over time</div>
</div>

<div id="stats">
  <div class="stat"><div class="stat-value" id="stat-count">0</div><div class="stat-label">Spills</div></div>
  <div class="stat"><div class="stat-value" id="stat-spilled">0</div><div class="stat-label">Barrels spilled</div></div>
  <div class="stat"><div class="stat-value" id="stat-recovered">0</div><div class="stat-label">% recovered</div></div>
</div>

<script>
// ── Load real data from the API ───────────────────────────────────────
// The FastAPI app serves this page (same origin) at /site/prototype.html
// and the data at /api/v1/spills/*. No hardcoded samples: what you see is
// exactly what the ETL produced.

const API_BASE = '/api/v1';

// ── Timeline state ──────────────────────────────────────────────────────
// allFeatures holds every drawable record; the slider re-slices it via
// source.setData so MapLibre clustering keeps working. Two modes:
//   cumulative — everything up to and including the slider year
//   single     — only records from the slider year
let allFeatures = [];
let timelineMode = 'cumulative';   // or 'single'
let timelineYear = null;           // null = full record (slider untouched)

function filteredFeatures() {
  if (timelineYear === null) return allFeatures;
  return allFeatures.filter(f => {
    const y = f.properties.year;
    return timelineMode === 'single'
      ? y === timelineYear
      : (y !== null && y !== undefined && y <= timelineYear);
  });
}

function applyTimeline() {
  const label = document.getElementById('year-label');
  if (timelineYear === null) {
    label.textContent = 'All years';
  } else {
    label.textContent = timelineMode === 'single'
      ? String(timelineYear)
      : `≤ ${timelineYear}`;
  }
  const drawable = { type: 'FeatureCollection', features: filteredFeatures() };
  map.getSource('spills').setData(drawable);
  // Keep the stat panel honest: count and volume reflect what is shown.
  let spilled = 0;
  for (const f of filteredFeatures()) {
    const q = f.properties.quantity_spilled;
    if (typeof q === 'number' && isFinite(q)) spilled += q;
  }
  document.getElementById('stat-count').textContent =
    filteredFeatures().length.toLocaleString();
  document.getElementById('stat-spilled').textContent =
    Math.round(spilled).toLocaleString();
}

function setupTimeline() {
  const wrap = document.getElementById('timeline');
  const slider = document.getElementById('year-slider');
  const toggle = document.getElementById('timeline-toggle');

  const years = allFeatures
    .map(f => f.properties.year)
    .filter(y => typeof y === 'number' && y >= 1900);
  if (!years.length) return;  // nothing dated — keep the panel hidden
  slider.min = Math.min(...years);
  slider.max = Math.max(...years);
  slider.value = slider.max;
  wrap.hidden = false;

  slider.addEventListener('input', () => {
    timelineYear = parseInt(slider.value, 10);
    applyTimeline();
  });
  toggle.addEventListener('click', () => {
    timelineMode = timelineMode === 'cumulative' ? 'single' : 'cumulative';
    toggle.textContent = timelineMode === 'cumulative' ? 'Single year' : 'Cumulative';
    toggle.classList.toggle('on', timelineMode === 'single');
    applyTimeline();
  });
}

async function fetchAllSpills() {
  // The API caps pages at 500; the timeline needs the whole record, so
  // paginate by offset until we have every feature.
  const PAGE = 500;
  const first = await fetch(
    `${API_BASE}/spills/geojson?limit=${PAGE}`).then(r => {
      if (!r.ok) throw new Error(`geojson ${r.status}`);
      return r.json();
    });
  const total = first.metadata?.total ?? first.features.length;
  const pages = [first];
  const rest = [];
  for (let offset = PAGE; offset < total; offset += PAGE) {
    rest.push(
      fetch(`${API_BASE}/spills/geojson?limit=${PAGE}&offset=${offset}`)
        .then(r => {
          if (!r.ok) throw new Error(`geojson ${r.status}`);
          return r.json();
        }));
  }
  // Small batches keep the local API comfortable.
  for (let i = 0; i < rest.length; i += 5) {
    pages.push(...await Promise.all(rest.slice(i, i + 5)));
  }
  return { features: pages.flatMap(p => p.features) };
}

async function loadData() {
  const banner = document.getElementById('banner');
  try {
    const [geoRes, statsRes] = await Promise.all([
      fetchAllSpills(),
      fetch(`${API_BASE}/spills/stats`),
    ]);
    if (!statsRes.ok) {
      throw new Error(`API responded ${statsRes.status}`);
    }
    const geo = geoRes;
    const stats = await statsRes.json();

    // Records without coordinates are kept in the data but cannot be drawn.
    allFeatures = geo.features.filter(f => f.geometry !== null);
    map.getSource('spills').setData(
      { type: 'FeatureCollection', features: allFeatures });

    document.getElementById('stat-count').textContent =
      stats.total_incidents.toLocaleString();
    document.getElementById('stat-spilled').textContent =
      stats.total_spilled_bbl.toLocaleString();
    document.getElementById('stat-recovered').textContent =
      `${stats.overall_recovery_pct ?? 0}%`;

    setupTimeline();

    window.__observatoryLoaded = true;
    window.__observatoryDrawable = allFeatures.length;
  } catch (err) {
    banner.hidden = false;
    banner.textContent = `API unreachable — start it with: python -m uvicorn src.api.main:app --port 8766 (${err.message})`;
  }
}

// ── Map initialization ────────────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://demotiles.maplibre.org/style.json',
  center: [6.5, 5.2],
  zoom: 7,
  maxBounds: [[2.0, 3.0], [15.0, 14.0]],
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

map.on('load', () => {
  map.addSource('spills', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: [] },
    cluster: true,
    clusterMaxZoom: 12,
    clusterRadius: 40,
  });
  loadData();

  // Clusters
  map.addLayer({
    id: 'spill-clusters',
    type: 'circle',
    source: 'spills',
    filter: ['has', 'point_count'],
    paint: {
      'circle-color': ['step', ['get', 'point_count'], '#ff6b35', 5, '#e83939', 15, '#b31d1d'],
      'circle-radius': ['step', ['get', 'point_count'], 18, 5, 24, 15, 30],
      'circle-opacity': 0.7,
      'circle-stroke-width': 2,
      'circle-stroke-color': '#fff',
    },
  });

  map.addLayer({
    id: 'cluster-count',
    type: 'symbol',
    source: 'spills',
    filter: ['has', 'point_count'],
    layout: {
      'text-field': ['get', 'point_count_abbreviated'],
      // demotiles serves only Open Sans Semibold glyphs — requesting a
      // Mapbox-specific font stack 404s the glyphs and fails the whole
      // tile, which silently drops every clustered point.
      'text-font': ['Open Sans Semibold'],
      'text-size': 13,
    },
    paint: { 'text-color': '#fff' },
  });

  // Individual spills
  map.addLayer({
    id: 'spill-points',
    type: 'circle',
    source: 'spills',
    filter: ['!', ['has', 'point_count']],
    paint: {
      'circle-color': ['match', ['get', 'spill_type'], 'condensate', '#4ecdc4', '#ff6b35'],
      'circle-radius': [
        'case',
        ['<=', ['coalesce', ['get', 'quantity_spilled'], 0], 10], 6,
        ['<=', ['get', 'quantity_spilled'], 500], 10,
        16,
      ],
      'circle-opacity': 0.8,
      'circle-stroke-width': 1.5,
      'circle-stroke-color': '#fff',
    },
  });

  // Popup
  const popup = new maplibregl.Popup({ offset: 24, closeButton: true });

  map.on('click', 'spill-points', (e) => {
    const p = e.features[0].properties;
    const recPct = p.quantity_spilled > 0
      ? ((p.quantity_recovered ?? 0) / p.quantity_spilled * 100).toFixed(1)
      : '0.0';
    const fmt = (v) => (v ?? 0).toLocaleString();
    popup.setLngLat(e.lngLat).setHTML(`
      <div class="popup-content">
        <h3>${p.incident_id}</h3>
        <p><strong>Date:</strong> ${p.date ?? 'unrecorded'}</p>
        <p><strong>State:</strong> ${p.state ?? '—'}</p>
        <p><strong>Company:</strong> ${p.company ?? '—'}</p>
        <p><strong>Cause:</strong> ${p.cause ?? '—'}</p>
        <p><strong>Spilled:</strong> ${fmt(p.quantity_spilled)} bbl</p>
        <p><strong>Recovered:</strong> ${fmt(p.quantity_recovered)} bbl (${recPct}%)</p>
        <p><strong>Impact area:</strong> ${p.impact_area ?? '—'}</p>
        <p><strong>Source:</strong> ${p.data_source ?? 'NOSDRA'}</p>
      </div>
    `).addTo(map);
  });

  map.on('mouseenter', 'spill-points', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'spill-points', () => { map.getCanvas().style.cursor = ''; });
});
</script>
</body>
</html>
