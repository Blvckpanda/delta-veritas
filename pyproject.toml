[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "RUF",  # ruff-specific
]
ignore = [
    # FastAPI's dependency-injection pattern uses Depends()/Query() in
    # argument defaults by design — B008 misfires on every route signature.
    "B008",
    # Timezone-naive datetimes are currently deliberate: pipeline output
    # filenames and log stamps are local-time. A tz-awareness pass is queued
    # before any deployment; until then DTZ noise is suppressed.
    "DTZ",
    # The /health endpoint catches Exception deliberately — any failure mode
    # must degrade to "degraded", never 500.
    "BLE001",
    # dict(...) inside matplotlib kwargs (bbox=dict(...)) is idiomatic there.
    "C408",
    # House style uses en-dashes in comments/docstrings (e.g. "2010–2026").
    # Ruff's ambiguous-unicode rules flag them; they are intentional.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Parametrized test-case tables are intentionally mutable-looking class attrs.
"tests/*" = ["RUF012"]
